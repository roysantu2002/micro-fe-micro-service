# ============================================================
# Local development — rsbuild + nginx + MSAL
#
# Three auth modes (set in .env, then rebuild with --build):
#
#   Mode 1 — Skip auth (fastest, no login screen):
#     PUBLIC_DEV_SKIP_AUTH=true
#     PUBLIC_MOCK_AUTH=false
#
#   Mode 2 — Mock login screen (no Azure account needed):
#     PUBLIC_DEV_SKIP_AUTH=false
#     PUBLIC_MOCK_AUTH=true
#     → runs mock-oauth2-server on :8787, enter any user/password
#
#   Mode 3 — Real Azure AD login:
#     PUBLIC_DEV_SKIP_AUTH=false
#     PUBLIC_MOCK_AUTH=false
#     → requires http://localhost:3000 registered as SPA redirect URI in Entra ID
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build
# ============================================================

services:

  # ── Mock OIDC server (Mode 2 only) ────────────────────────
  # Simulates Microsoft login locally — no Azure account needed
  # Login UI at http://localhost:8787/default/debugger
  mock-auth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: local-mock-auth
    ports:
      - "8787:8080"
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper"
        }
    profiles:
      - mock

  # ── MFE: Topic Manager ─────────────────────────────────────
  topic-manager-mfe:
    build:
      context: ./frontend/topic-manager-mfe
      dockerfile: Containerfile
      args:
        PUBLIC_API_URL: http://localhost:3000/api
    container_name: local-topic-manager
    networks:
      - mfe-network

  # ── MFE: Content Writer ────────────────────────────────────
  content-writer-mfe:
    build:
      context: ./frontend/content-writer-mfe
      dockerfile: Containerfile
      args:
        PUBLIC_API_URL: http://localhost:3000/api
    container_name: local-content-writer
    networks:
      - mfe-network

  # ── Host App (nginx proxy + MSAL shell) ────────────────────
  host-app:
    build:
      context: ./frontend/host-app
      dockerfile: Containerfile
      args:
        # MFE manifests are served through the host-app nginx proxy
        PUBLIC_TOPIC_MANAGER_REMOTE: http://localhost:3000/mfe/topic-manager/mf-manifest.json
        PUBLIC_CONTENT_WRITER_REMOTE: http://localhost:3000/mfe/content-writer/mf-manifest.json
        PUBLIC_ENTRA_CLIENT_ID: ${PUBLIC_ENTRA_CLIENT_ID}
        PUBLIC_ENTRA_TENANT_ID: ${PUBLIC_ENTRA_TENANT_ID}
        # Set to "true" in .env to skip Microsoft login during local dev
        PUBLIC_DEV_SKIP_AUTH: ${PUBLIC_DEV_SKIP_AUTH:-false}
        # Set to "true" in .env to use local mock-oauth2-server instead of Azure AD
        PUBLIC_MOCK_AUTH: ${PUBLIC_MOCK_AUTH:-false}
    container_name: local-host-app
    ports:
      - "3000:80"
    depends_on:
      - topic-manager-mfe
      - content-writer-mfe
    networks:
      - mfe-network

networks:
  mfe-network:
    driver: bridge
