name: Build, Push & Deploy MFE

# ── How auth works (no passwords stored in GitHub) ────────────────────────────
# GitHub Actions gets a short-lived OIDC token from GitHub itself.
# Azure trusts that token because of the Federated Identity Credential in oidc.tf.
# GitHub Actions then gets a short-lived Azure access token — no JSON secrets.
# Azure Container Apps pull from ACR using Managed Identity — no PAT needed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, feature/rsbuild-azure-container-apps]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write    # Required for OIDC — lets GitHub issue the identity token
  contents: read
  packages: read

env:
  # These 3 are plain variables (not secrets) — set them in repo Settings → Variables
  AZURE_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}       # App Registration client ID from oidc.tf output
  AZURE_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}       # Tenant ID from oidc.tf output
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }} # ac91a2b4-4d65-4c8d-9e4f-db410eef92a0
  ACR_LOGIN_SERVER:      ${{ vars.ACR_LOGIN_SERVER }}       # ytplanneracr.azurecr.io (from terraform output)
  RESOURCE_GROUP:        rg-yt-planner

jobs:
  # ── Build & push topic-manager-mfe ──────────────────────────────────────────
  build-topic-manager:
    name: Build topic-manager-mfe
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      # OIDC login — no password, no service principal JSON
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ env.AZURE_CLIENT_ID }}
          tenant-id:       ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ytplanneracr

      - name: Set image name
        id: image
        run: |
          TAG=${{ env.ACR_LOGIN_SERVER }}/topic-manager-mfe:sha-${{ github.sha }}
          echo "name=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/topic-manager-mfe
          file: ./frontend/topic-manager-mfe/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ env.ACR_LOGIN_SERVER }}/topic-manager-mfe:latest
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://nginx-gateway' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & push content-writer-mfe ─────────────────────────────────────────
  build-content-writer:
    name: Build content-writer-mfe
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ env.AZURE_CLIENT_ID }}
          tenant-id:       ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ytplanneracr

      - name: Set image name
        id: image
        run: |
          TAG=${{ env.ACR_LOGIN_SERVER }}/content-writer-mfe:sha-${{ github.sha }}
          echo "name=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend/content-writer-mfe
          file: ./frontend/content-writer-mfe/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ env.ACR_LOGIN_SERVER }}/content-writer-mfe:latest
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://nginx-gateway' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & push host-app ────────────────────────────────────────────────────
  build-host-app:
    name: Build host-app
    runs-on: ubuntu-latest
    needs: [build-topic-manager, build-content-writer]
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ env.AZURE_CLIENT_ID }}
          tenant-id:       ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ytplanneracr

      - name: Set image name
        id: image
        run: |
          TAG=${{ env.ACR_LOGIN_SERVER }}/host-app:sha-${{ github.sha }}
          echo "name=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend/host-app
          file: ./frontend/host-app/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ env.ACR_LOGIN_SERVER }}/host-app:latest
          build-args: |
            PUBLIC_TOPIC_MANAGER_REMOTE=/mfe/topic-manager/mf-manifest.json
            PUBLIC_CONTENT_WRITER_REMOTE=/mfe/content-writer/mf-manifest.json
            PUBLIC_ENTRA_CLIENT_ID=${{ vars.PUBLIC_ENTRA_CLIENT_ID }}
            PUBLIC_ENTRA_TENANT_ID=${{ vars.PUBLIC_ENTRA_TENANT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Azure Container Apps (main branch only) ────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build-host-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ env.AZURE_CLIENT_ID }}
          tenant-id:       ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy topic-manager-mfe
        run: |
          az containerapp update \
            --name topic-manager-mfe \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/topic-manager-mfe:sha-${{ github.sha }}

      - name: Deploy content-writer-mfe
        run: |
          az containerapp update \
            --name content-writer-mfe \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/content-writer-mfe:sha-${{ github.sha }}

      - name: Deploy host-app
        run: |
          az containerapp update \
            --name host-app \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/host-app:sha-${{ github.sha }}

      - name: Print app URL
        run: |
          URL=$(az containerapp show \
            --name host-app \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "✅ App live at: https://$URL"
