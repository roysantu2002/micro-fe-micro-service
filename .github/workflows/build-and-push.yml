name: Build, Push & Deploy MFE

# ── Auth summary ──────────────────────────────────────────────────────────────
# Push to GHCR:   uses GITHUB_TOKEN (auto-provided by GitHub, no setup needed)
# Deploy to Azure: uses OIDC (3 plain vars in GitHub, no secrets/passwords)
# Pull from GHCR:  packages are set to Public — Container Apps need no credentials
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, feature/rsbuild-azure-container-apps]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login to Azure
  contents: read
  packages: write   # Required to push images to GHCR

env:
  GHCR_REGISTRY:   ghcr.io
  IMAGE_PREFIX:    ghcr.io/roysantu2002/micro-fe-micro-service
  RESOURCE_GROUP:  rg-yt-planner

jobs:
  # ── Build & push topic-manager-mfe ──────────────────────────────────────────
  build-topic-manager:
    name: Build topic-manager-mfe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is automatically available — no setup, no expiry, scoped to this repo
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/topic-manager-mfe
          file: ./frontend/topic-manager-mfe/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/topic-manager-mfe:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/topic-manager-mfe:latest
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://nginx-gateway' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & push content-writer-mfe ─────────────────────────────────────────
  build-content-writer:
    name: Build content-writer-mfe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/content-writer-mfe
          file: ./frontend/content-writer-mfe/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/content-writer-mfe:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/content-writer-mfe:latest
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://nginx-gateway' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & push host-app ────────────────────────────────────────────────────
  build-host-app:
    name: Build host-app
    runs-on: ubuntu-latest
    needs: [build-topic-manager, build-content-writer]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/host-app
          file: ./frontend/host-app/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/host-app:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/host-app:latest
          build-args: |
            PUBLIC_TOPIC_MANAGER_REMOTE=${{ vars.HOST_APP_URL }}/mfe/topic-manager/mf-manifest.json
            PUBLIC_CONTENT_WRITER_REMOTE=${{ vars.HOST_APP_URL }}/mfe/content-writer/mf-manifest.json
            PUBLIC_ENTRA_CLIENT_ID=${{ vars.PUBLIC_ENTRA_CLIENT_ID }}
            PUBLIC_ENTRA_TENANT_ID=${{ vars.PUBLIC_ENTRA_TENANT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Azure Container Apps (main branch only) ────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build-host-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      # OIDC login — no AZURE_CREDENTIALS secret, just 3 plain variable IDs
      - name: Azure Login (OIDC — no password)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy topic-manager-mfe
        run: |
          az containerapp update \
            --name topic-manager-mfe \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_PREFIX }}/topic-manager-mfe:sha-${{ github.sha }}

      - name: Deploy content-writer-mfe
        run: |
          az containerapp update \
            --name content-writer-mfe \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_PREFIX }}/content-writer-mfe:sha-${{ github.sha }}

      - name: Deploy host-app
        run: |
          az containerapp update \
            --name host-app \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_PREFIX }}/host-app:sha-${{ github.sha }}

      - name: Print live URL
        run: |
          URL=$(az containerapp show \
            --name host-app \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "App live at: https://$URL"
