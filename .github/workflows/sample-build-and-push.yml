name: Sample MFE — Build, Push & Deploy

on:
  push:
    branches: [main, rsbuild-azure-container-apps]
    paths:
      - 'mfe-sample-complete/**'
      - '.github/workflows/sample-build-and-push.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX:  ghcr.io/roysantu2002/micro-fe-micro-service
  RESOURCE_GROUP: rg-yt-planner

jobs:
  # ── Build sample-items-mfe ──────────────────────────────────────────────────
  build-items-mfe:
    name: Build sample-items-mfe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./mfe-sample-complete/frontend/items-mfe
          file: ./mfe-sample-complete/frontend/items-mfe/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sample-items-mfe:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/sample-items-mfe:latest
          build-args: |
            PUBLIC_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build sample-items-service (Spring Boot) ────────────────────────────────
  build-items-service:
    name: Build sample-items-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./mfe-sample-complete/backend/items-service
          file: ./mfe-sample-complete/backend/items-service/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sample-items-service:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/sample-items-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build sample-host-app ───────────────────────────────────────────────────
  build-host-app:
    name: Build sample-host-app
    runs-on: ubuntu-latest
    needs: [build-items-mfe]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./mfe-sample-complete/frontend/host-app
          file: ./mfe-sample-complete/frontend/host-app/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sample-host-app:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/sample-host-app:latest
          build-args: |
            PUBLIC_ITEMS_MFE_REMOTE=/mfe/items/mf-manifest.json
            PUBLIC_ENTRA_CLIENT_ID=${{ vars.PUBLIC_ENTRA_CLIENT_ID }}
            PUBLIC_ENTRA_TENANT_ID=${{ vars.PUBLIC_ENTRA_TENANT_ID }}
            PUBLIC_MOCK_AUTH=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Azure Container Apps (main branch only) ───────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-host-app, build-items-service]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy sample-items-mfe
        run: |
          az containerapp update \
            --name sample-items-mfe \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_PREFIX }}/sample-items-mfe:sha-${{ github.sha }}

      - name: Deploy sample-items-service
        run: |
          az containerapp update \
            --name sample-items-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_PREFIX }}/sample-items-service:sha-${{ github.sha }}

      - name: Deploy sample-host-app
        run: |
          az containerapp update \
            --name sample-host-app \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_PREFIX }}/sample-host-app:sha-${{ github.sha }}

      - name: Print live URL
        run: |
          URL=$(az containerapp show \
            --name sample-host-app \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "✅ Sample app live at: https://$URL"
          echo "👉 Add https://$URL to Entra SPA redirect URIs if not already done"
