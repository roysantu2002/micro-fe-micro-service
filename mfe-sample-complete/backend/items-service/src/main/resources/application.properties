server.port=8080

# --- Auth mode ---
# true  = accept any Bearer token (local dev with mock frontend)
# false = validate JWT against Azure Entra ID (production)
mock.auth=false

# Azure Entra JWT validation — used when mock.auth=false
# Set AZURE_TENANT_ID env var or replace below
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:7e626a1e-dd27-4d19-a481-834ea79cd15b}/v2.0

# CORS — allow host-app origins (extend for production URL)
cors.allowed-origins=http://localhost:3000,http://localhost:3001
