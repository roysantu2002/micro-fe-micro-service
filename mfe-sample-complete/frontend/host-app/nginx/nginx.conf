server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache hashed static assets 1 year
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy MFE assets — browser fetches JS from same origin, nginx forwards internally
    location ^~ /mfe/items/ {
        proxy_pass         http://sample-items-mfe/;
        proxy_http_version 1.1;
        proxy_set_header   Host sample-items-mfe;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_pragma;
        proxy_no_cache     $http_pragma;
        add_header         Cache-Control "no-store";
    }

    # Proxy API calls to Spring Boot — avoids CORS entirely
    location ^~ /api/ {
        proxy_pass         http://sample-items-service/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host sample-items-service;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
