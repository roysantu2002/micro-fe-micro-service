server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache immutable hashed assets from rsbuild (1 year)
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy: browser fetches MFE chunks via same-origin path
    # ^~ prefix stops nginx checking regex locations (like the .js cache rule below)
    # so these proxy blocks always win over the static-asset cache rule.
    location ^~ /mfe/topic-manager/ {
        proxy_pass         http://topic-manager-mfe/;
        proxy_http_version 1.1;
        proxy_set_header   Host topic-manager-mfe;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_pragma;
        proxy_no_cache     $http_pragma;
        add_header         Cache-Control "no-store";
    }

    location ^~ /mfe/content-writer/ {
        proxy_pass         http://content-writer-mfe/;
        proxy_http_version 1.1;
        proxy_set_header   Host content-writer-mfe;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_pragma;
        proxy_no_cache     $http_pragma;
        add_header         Cache-Control "no-store";
    }

    # SPA fallback — React Router handles all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint for Container Apps liveness probe
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
